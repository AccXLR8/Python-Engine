[project]
name = "chainreaction-py"
version = "0.1.0"
description = "Pure Python implementation of the Chain Reaction engine using NumPy"
authors = [{ name = "Chain Reaction Engine Contributors" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=67", "wheel"]
build-backend = "setuptools.build_meta"
